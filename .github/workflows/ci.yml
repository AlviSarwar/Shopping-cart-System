name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile (warnings are errors)
        run: javac -Xlint:all -Werror -d out src/*.java test/*.java

      - name: Run tests
        run: java -cp out ShoppingCartTest
